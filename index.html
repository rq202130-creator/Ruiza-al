<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUİZA AI</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 16px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #334155; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; }
    .user { background: #2563eb; align-self: flex-end; }
    .bot { background: #1e293b; align-self: flex-start; border: 1px solid #334155; }
    #input-area { display: flex; padding: 12px; background: #1e293b; gap: 8px; }
    input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; }
    button { padding: 12px 18px; border: none; border-radius: 10px; background: #22c55e; color: #052e16; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <header>RUİZA AI</header>
  <div id="chat">
    <div class="msg bot">Salam! Mən RUİZA AI. Sizə necə kömək edə bilərəm?</div>
  </div>
  <div id="input-area">
    <input id="prompt" type="text" placeholder="Sualınızı yazın..." />
    <button id="send">Göndər</button>
  </div>
  <script>
    const API_KEY = "AQ.Ab8RN6I0CgNQhhv8A9OgaY0joV4xFOIzrLJcx8_Vvad5HsvvgQ";
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      addMsg(text, "user");
      const loadingMsg = addMsg("Düşünürəm...", "bot");
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text }] }] })
        });
        const data = await res.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Cavab alına bilmədi. API açarını yoxlayın.";
        loadingMsg.textContent = reply;
      } catch (err) {
        loadingMsg.textContent = "Şəbəkə xətası: " + err.message;
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
